# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "imx6ull-mini"
BBFILE_PATTERN_imx6ull-mini = "^${LAYERDIR}/"
BBFILE_PRIORITY_imx6ull-mini = "8"

LAYERDEPENDS_imx6ull-mini = "core"
LAYERSERIES_COMPAT_imx6ull-mini = "scarthgap"
