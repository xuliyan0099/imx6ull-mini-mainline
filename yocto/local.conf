# imx6ull_mini Yocto 构建配置（poky scarthgap 5.0）
MACHINE = "imx6ull-mini"
DISTRO = "poky"
PACKAGE_CLASSES = "package_ipk"

# 手写路线四层的源码树（u-boot / linux / busybox / lvgl），由 externalsrc 直接引用
IM6_SRC = "/work/src"
IM6_REPO = "/work/repo"

DL_DIR = "/work/yocto/downloads"
SSTATE_DIR = "/work/yocto/sstate-cache"
TMPDIR = "/work/yocto/tmp"

BB_NUMBER_THREADS = "16"
PARALLEL_MAKE = "-j 16"

# Beelink 连不上 GitHub / git.yoctoproject.org，全部走 Yocto 官方源码镜像（含 git tarball 目录 git2/）
INHERIT += "own-mirrors"
SOURCE_MIRROR_URL = "https://downloads.yoctoproject.org/mirror/sources/"

EXTRA_IMAGE_FEATURES = ""
USER_CLASSES ?= "buildstats"
CONF_VERSION = "2"

# poky 默认 DISTRO_FEATURES 带 ptest，会把 python3-ptest 一类测试包拉进 rootfs，
# 进而拖出 target gcc（几十个任务、还编不过）。这个镜像不需要 ptest。
DISTRO_FEATURES:remove = "ptest"

# 本板内核把 netfilter/scsi 等编成 built-in，不产出 kernel-module-* 包，
# 而 poky 的 iptables / util-linux 把它们写进了 RRECOMMENDS，缺失会打断依赖图。
# 用层里的 class 统一摘掉 kernel-module-* 依赖（rootfs 本来也不装这些包）。
INHERIT += "im6-strip-kernel-module-deps"

# rootfs 不装 man-db，用层里的空脚本覆盖 poky 的 update_mandb 索引钩子
POSTINST_INTERCEPTS_PATHS:prepend = "${IM6_REPO}/yocto/meta-imx6ull-mini/postinst-intercepts:"
